<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs><linearGradient id="bg"><stop stop-color="#08090d"/><stop offset="1" stop-color="#18120a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#d7a62a"/></marker></defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/><text x="600" y="55" text-anchor="middle" fill="#f1c75b" font-family="Arial" font-size="30" font-weight="700">IDW VOICE MIDI STUDIO V3 — FL STUDIO ROUTING</text>
  <g font-family="Arial" text-anchor="middle">
    <g transform="translate(45 145)"><rect width="220" height="170" rx="18" fill="#161821" stroke="#d7a62a" stroke-width="3"/><text x="110" y="58" fill="white" font-size="25" font-weight="700">MICROPHONE</text><text x="110" y="98" fill="#bfc2cc" font-size="18">Mono interface input</text><text x="110" y="130" fill="#bfc2cc" font-size="18">Use headphones</text></g>
    <g transform="translate(345 145)"><rect width="240" height="170" rx="18" fill="#161821" stroke="#d7a62a" stroke-width="3"/><text x="120" y="48" fill="white" font-size="23" font-weight="700">FL MIXER INSERT</text><text x="120" y="88" fill="#bfc2cc" font-size="18">Select mic input</text><text x="120" y="122" fill="#f1c75b" font-size="20" font-weight="700">Load IDW VST3</text><text x="120" y="150" fill="#bfc2cc" font-size="16">Output port: 10</text></g>
    <g transform="translate(665 145)"><rect width="220" height="170" rx="18" fill="#161821" stroke="#d7a62a" stroke-width="3"/><text x="110" y="48" fill="white" font-size="23" font-weight="700">MIDI LINK</text><text x="110" y="91" fill="#f1c75b" font-size="25" font-weight="700">PORT 10</text><text x="110" y="127" fill="#bfc2cc" font-size="17">Numbers must match</text></g>
    <g transform="translate(965 145)"><rect width="190" height="170" rx="18" fill="#161821" stroke="#d7a62a" stroke-width="3"/><text x="95" y="48" fill="white" font-size="23" font-weight="700">SYNTH VST</text><text x="95" y="87" fill="#bfc2cc" font-size="17">Input port: 10</text><text x="95" y="121" fill="#bfc2cc" font-size="17">Bend: match IDW</text><text x="95" y="149" fill="#f1c75b" font-size="18" font-weight="700">Makes the sound</text></g>
  </g>
  <g stroke="#d7a62a" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M270 230H335"/><path d="M590 230H655"/><path d="M890 230H955"/></g>
  <text x="600" y="390" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="700">Audio enters IDW • MIDI leaves IDW • The destination synth makes sound</text><text x="600" y="430" text-anchor="middle" fill="#bfc2cc" font-family="Arial" font-size="19">If IDW detects notes but you hear silence, check both wrapper port numbers first.</text>
</svg>
