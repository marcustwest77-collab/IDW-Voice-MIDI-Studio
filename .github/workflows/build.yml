name: Build, Validate and Package IDW Voice MIDI Studio

on:
  push:
    branches: [main, version-3-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout IDW Voice MIDI Studio
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Download pluginval on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate VST3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $validator) { throw "pluginval.exe not found" }
          $plugin = Resolve-Path "build/IDWVoiceMIDIStudio_artefacts/Release/VST3/IDW Voice MIDI Studio.vst3"
          & $validator.FullName --strictness-level 5 $plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download pluginval on macOS
        if: runner.os == 'macOS'
        run: |
          curl -L "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval
          chmod +x "pluginval/pluginval.app/Contents/MacOS/pluginval" || true

      - name: Validate VST3 on macOS
        if: runner.os == 'macOS'
        run: |
          VALIDATOR=$(find pluginval -type f -path "*/Contents/MacOS/pluginval" | head -n 1)
          if [ -z "$VALIDATOR" ]; then echo "pluginval executable not found"; exit 1; fi
          "$VALIDATOR" --strictness-level 5 "build/IDWVoiceMIDIStudio_artefacts/Release/VST3/IDW Voice MIDI Studio.vst3"

      - name: Validate Audio Unit on macOS
        if: runner.os == 'macOS'
        run: |
          COMPONENT="build/IDWVoiceMIDIStudio_artefacts/Release/AU/IDW Voice MIDI Studio.component"
          PLIST="$COMPONENT/Contents/Info.plist"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "$COMPONENT" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          AU_TYPE=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:type' "$PLIST")
          AU_SUBTYPE=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:subtype' "$PLIST")
          AU_MFR=$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0:manufacturer' "$PLIST")
          echo "Validating AU $AU_TYPE / $AU_SUBTYPE / $AU_MFR"
          auval -v "$AU_TYPE" "$AU_SUBTYPE" "$AU_MFR"

      - name: Stage Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/Windows/VST3 | Out-Null
          New-Item -ItemType Directory -Force -Path release/Windows/Standalone | Out-Null
          New-Item -ItemType Directory -Force -Path release/Documentation | Out-Null
          Copy-Item -Recurse "build/IDWVoiceMIDIStudio_artefacts/Release/VST3/IDW Voice MIDI Studio.vst3" "release/Windows/VST3/"
          Copy-Item "build/IDWVoiceMIDIStudio_artefacts/Release/Standalone/IDW Voice MIDI Studio.exe" "release/Windows/Standalone/"
          Copy-Item "docs/USER_MANUAL.md" "release/Documentation/USER_MANUAL.md"
          Copy-Item "docs/FL_STUDIO_SETUP.md" "release/Documentation/FL_STUDIO_SETUP.md"
          Copy-Item "docs/VERSION_3.md" "release/Documentation/VERSION_3.md"
          Copy-Item "Resources/FL_STUDIO_ROUTING.svg" "release/Documentation/FL_STUDIO_ROUTING.svg"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force -Path release/Installer | Out-Null
          $buildRoot = (Resolve-Path "build/IDWVoiceMIDIStudio_artefacts/Release").Path
          $outputDir = (Resolve-Path "release/Installer").Path
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "/DBuildRoot=$buildRoot" "/DOutputDir=$outputDir" "installer/windows/IDWVoiceMIDIStudio.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage macOS release package
        if: runner.os == 'macOS'
        run: |
          mkdir -p release/macOS/VST3 release/macOS/AU release/macOS/Standalone release/Documentation
          cp -R "build/IDWVoiceMIDIStudio_artefacts/Release/VST3/IDW Voice MIDI Studio.vst3" release/macOS/VST3/
          cp -R "build/IDWVoiceMIDIStudio_artefacts/Release/AU/IDW Voice MIDI Studio.component" release/macOS/AU/
          cp -R "build/IDWVoiceMIDIStudio_artefacts/Release/Standalone/IDW Voice MIDI Studio.app" release/macOS/Standalone/
          cp docs/USER_MANUAL.md release/Documentation/USER_MANUAL.md
          cp docs/FL_STUDIO_SETUP.md release/Documentation/FL_STUDIO_SETUP.md
          cp docs/VERSION_3.md release/Documentation/VERSION_3.md
          cp Resources/FL_STUDIO_ROUTING.svg release/Documentation/FL_STUDIO_ROUTING.svg

      - name: Build macOS installer package and DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x installer/macos/package.sh
          ./installer/macos/package.sh "build/IDWVoiceMIDIStudio_artefacts/Release" "release/Installer"

      - name: Upload install-ready release package
        uses: actions/upload-artifact@v4
        with:
          name: IDW-Voice-MIDI-Studio-Install-${{ matrix.os }}
          path: release/**
          if-no-files-found: error
