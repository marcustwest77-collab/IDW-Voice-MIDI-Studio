name: V14 Remote Standalone C++ Tests
on:
  push:
    branches:
      - 'ci/**'
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-unit:
    name: Remote C++17 tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run remote tests in Release-equivalent mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-test-bin
          for source in DAW/tests/Remote*Tests.cpp DAW/tests/ValidatedControlReceiverTests.cpp; do
            name="$(basename "${source%.cpp}")"
            echo "Compiling ${name}"
            # Keep this array nonempty: macOS Bash 3.2 treats an empty array
            # expansion as unbound under set -u.
            compile=(g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror "$source" -o "remote-test-bin/$name" -pthread)
            if [[ "$name" == "RemoteLocalSocketReceiverTests" ]]; then
              compile+=(DAW/RemoteLocalSocketReceiver.cpp)
              if [[ "${{ runner.os }}" == "Windows" ]]; then compile+=(-lws2_32); fi
            fi
            if [[ "$name" == "RemoteLocalSessionOwnerTests" ]]; then
              compile+=(DAW/RemoteLocalSocketReceiver.cpp DAW/RemoteLocalSessionSecret.cpp)
              if [[ "${{ runner.os }}" == "Windows" ]]; then compile+=(-lws2_32 -lbcrypt); fi
              if [[ "${{ runner.os }}" == "macOS" ]]; then compile+=(-framework Security); fi
            fi
            if [[ "$name" == "RemoteWindowsBootstrapChannelTests" ]]; then
              compile+=(DAW/RemoteWindowsBootstrapChannel.cpp DAW/RemoteLocalSocketReceiver.cpp DAW/RemoteLocalSessionSecret.cpp)
              if [[ "${{ runner.os }}" == "Windows" ]]; then compile+=(-lws2_32 -lbcrypt -ladvapi32); fi
              if [[ "${{ runner.os }}" == "macOS" ]]; then compile+=(-framework Security); fi
            fi
            if [[ "$name" == "RemoteWindowsBridgeSessionTests" ]]; then
              compile+=(DAW/RemoteWindowsBridgeSession.cpp DAW/RemoteWindowsBootstrapChannel.cpp DAW/RemoteLocalSocketReceiver.cpp DAW/RemoteLocalSessionSecret.cpp)
              if [[ "${{ runner.os }}" == "Windows" ]]; then compile+=(-lws2_32 -lbcrypt -ladvapi32); fi
              if [[ "${{ runner.os }}" == "macOS" ]]; then compile+=(-framework Security); fi
            fi
            "${compile[@]}"
            echo "Running ${name}"
            "./remote-test-bin/$name"
          done

      - name: Test Python wire protocol through C++ review receiver
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteCrossLanguageHandoffFixture.cpp -o remote-test-bin/handoff-fixture -pthread
          python DAW/network/test_cpp_command_handoff.py remote-test-bin/handoff-fixture

      - name: Test loopback-only Python TCP transport
        shell: bash
        run: python DAW/network/test_loopback_transport.py

      - name: Test loopback command parser
        shell: bash
        run: python DAW/network/test_command_protocol.py

      - name: Test certificate-verified TLS client configuration
        shell: bash
        run: python DAW/network/test_tls_client.py

      - name: Test localhost TLS server configuration
        shell: bash
        run: python DAW/network/test_tls_loopback_server.py

      - name: Test encrypted localhost TLS roundtrip
        shell: bash
        run: python DAW/network/test_tls_roundtrip.py

      - name: Reject untrusted TLS server certificate
        shell: bash
        run: python DAW/network/test_tls_identity_rejection.py

      - name: Test remote session identity binding
        shell: bash
        run: python DAW/network/test_session_admission.py

      - name: Test trusted session channel binding
        shell: bash
        run: python DAW/network/test_channel_bound_session.py

      - name: Test guarded remote command intake
        shell: bash
        run: python DAW/network/test_guarded_command_intake.py

      - name: Test remote command replay guard
        shell: bash
        run: python DAW/network/test_replay_guard.py

      - name: Exercise guarded localhost TLS roundtrip through C++ review fixture
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteCrossLanguageHandoffFixture.cpp -o remote-test-bin/handoff-fixture -pthread
          IDW_CPP_REVIEW_FIXTURE=remote-test-bin/handoff-fixture python DAW/network/test_guarded_tls_roundtrip.py

      - name: Test authenticated localhost IPC and persistent C++ host review
        shell: bash
        run: |
          set -euo pipefail
          python DAW/network/test_verified_event_producer.py
          python DAW/network/test_local_receiver_auth.py
          python DAW/network/test_local_command_bridge.py
          python DAW/network/test_local_receiver_service.py
          python DAW/network/test_local_receiver_session.py
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteCrossLanguageHandoffFixture.cpp -o remote-test-bin/handoff-fixture -pthread
          IDW_CPP_REVIEW_FIXTURE=remote-test-bin/handoff-fixture python DAW/network/test_local_ipc_cpp_review.py
          IDW_CPP_REVIEW_FIXTURE=remote-test-bin/handoff-fixture python DAW/network/test_multi_local_ipc_cpp_review.py

      - name: Test mutual TLS client certificate authentication
        shell: bash
        run: python DAW/network/test_mutual_tls.py

      - name: Test pinned mTLS through native localhost queue and pending host review
        shell: bash
        run: |
          set -euo pipefail
          fixture=remote-test-bin/native-local-review
          if [[ "${{ runner.os }}" == "Windows" ]]; then fixture+=.exe; fi
          compile=(g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteNativeLocalReviewFixture.cpp DAW/RemoteLocalSocketReceiver.cpp DAW/RemoteLocalSessionSecret.cpp DAW/RemoteWindowsBootstrapChannel.cpp -o "$fixture" -pthread)
          if [[ "${{ runner.os }}" == "Windows" ]]; then compile+=(-lws2_32 -lbcrypt -ladvapi32); fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then compile+=(-framework Security); fi
          "${compile[@]}"
          python -c "import shutil; assert shutil.which('openssl'), 'OpenSSL CLI required for integration coverage'"
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_native_local_bridge.py -v
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_native_tls_session.py -v
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_native_tls_receiver.py -v
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_windows_native_bootstrap.py -v
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_native_socket_revocation.py -v
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_windows_native_lease.py -v
          IDW_NATIVE_LOCAL_FIXTURE="$fixture" python DAW/network/test_native_command_approval.py -v

      - name: Test mTLS approved client certificate pinning
        shell: bash
        run: python DAW/network/test_tls_client_pin.py

      - name: Test per-command host approval ledger
        shell: bash
        run: python DAW/network/test_host_approval_ledger.py
