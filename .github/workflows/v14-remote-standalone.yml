name: V14 Remote Standalone C++ Tests
on:
  push:
    branches:
      - 'ci/**'
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-unit:
    name: Remote C++17 tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run remote tests in Release-equivalent mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-test-bin
          for source in DAW/tests/Remote*Tests.cpp DAW/tests/ValidatedControlReceiverTests.cpp; do
            name="$(basename "${source%.cpp}")"
            echo "Compiling ${name}"
            g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror "$source" -o "remote-test-bin/$name"
            echo "Running ${name}"
            "./remote-test-bin/$name"
          done

      - name: Test loopback-only Python TCP transport
        shell: bash
        run: python DAW/network/test_loopback_transport.py

      - name: Test loopback command parser
        shell: bash
        run: python DAW/network/test_command_protocol.py

      - name: Test certificate-verified TLS client configuration
        shell: bash
        run: python DAW/network/test_tls_client.py

      - name: Test localhost TLS server configuration
        shell: bash
        run: python DAW/network/test_tls_loopback_server.py

      - name: Test encrypted localhost TLS roundtrip
        shell: bash
        run: python DAW/network/test_tls_roundtrip.py

      - name: Reject untrusted TLS server certificate
        shell: bash
        run: python DAW/network/test_tls_identity_rejection.py

      - name: Test remote session identity binding
        shell: bash
        run: python DAW/network/test_session_admission.py

      - name: Test trusted session channel binding
        shell: bash
        run: python DAW/network/test_channel_bound_session.py

      - name: Test guarded remote command intake
        shell: bash
        run: python DAW/network/test_guarded_command_intake.py

      - name: Test remote command replay guard
        shell: bash
        run: python DAW/network/test_replay_guard.py
