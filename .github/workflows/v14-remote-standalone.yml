name: V14 Remote Standalone C++ Tests
on:
  push:
    branches:
      - 'ci/**'
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-unit:
    name: Remote C++17 tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run remote tests in Release-equivalent mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-test-bin
          for source in DAW/tests/Remote*Tests.cpp DAW/tests/ValidatedControlReceiverTests.cpp; do
            name="$(basename "${source%.cpp}")"
            echo "Compiling ${name}"
            g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror "$source" -o "remote-test-bin/$name"
            echo "Running ${name}"
            "./remote-test-bin/$name"
          done

      - name: Test Python wire protocol through C++ review receiver
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteCrossLanguageHandoffFixture.cpp -o remote-test-bin/handoff-fixture -pthread
          python DAW/network/test_cpp_command_handoff.py remote-test-bin/handoff-fixture

      - name: Test Python delivery to native authenticated socket receiver
        shell: bash
        run: |
          set -euo pipefail
          libs=(-pthread)
          if [[ "$RUNNER_OS" == "Windows" ]]; then libs+=(-lws2_32); fi
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteNativeLocalReceiverFixture.cpp -o remote-test-bin/native-receiver "${libs[@]}"
          IDW_NATIVE_RECEIVER_FIXTURE=remote-test-bin/native-receiver python DAW/network/test_native_local_receiver.py
          python DAW/network/test_tls_worker_bootstrap.py
          python DAW/network/test_local_test_client.py
          python DAW/network/test_local_test_bundle.py
          IDW_NATIVE_RECEIVER_FIXTURE=remote-test-bin/native-receiver python DAW/network/test_tls_native_worker.py

      - name: Test native Windows worker process ownership
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteWindowsWorkerFixture.cpp -o remote-test-bin/windows-worker -pthread -lws2_32 -lbcrypt
          IDW_WINDOWS_WORKER_FIXTURE=remote-test-bin/windows-worker IDW_NATIVE_RECEIVER_FIXTURE=remote-test-bin/native-receiver python DAW/network/test_windows_worker_owner.py
          python DAW/network/test_local_test_client_ui.py

      - name: Test loopback-only Python TCP transport
        shell: bash
        run: python DAW/network/test_loopback_transport.py

      - name: Test loopback command parser
        shell: bash
        run: python DAW/network/test_command_protocol.py

      - name: Test certificate-verified TLS client configuration
        shell: bash
        run: python DAW/network/test_tls_client.py

      - name: Test localhost TLS server configuration
        shell: bash
        run: python DAW/network/test_tls_loopback_server.py

      - name: Test encrypted localhost TLS roundtrip
        shell: bash
        run: python DAW/network/test_tls_roundtrip.py

      - name: Reject untrusted TLS server certificate
        shell: bash
        run: python DAW/network/test_tls_identity_rejection.py

      - name: Test remote session identity binding
        shell: bash
        run: python DAW/network/test_session_admission.py

      - name: Test trusted session channel binding
        shell: bash
        run: python DAW/network/test_channel_bound_session.py

      - name: Test guarded remote command intake
        shell: bash
        run: python DAW/network/test_guarded_command_intake.py

      - name: Test remote command replay guard
        shell: bash
        run: python DAW/network/test_replay_guard.py

      - name: Exercise guarded localhost TLS roundtrip through C++ review fixture
        shell: bash
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteCrossLanguageHandoffFixture.cpp -o remote-test-bin/handoff-fixture -pthread
          IDW_CPP_REVIEW_FIXTURE=remote-test-bin/handoff-fixture python DAW/network/test_guarded_tls_roundtrip.py

      - name: Test authenticated localhost IPC and persistent C++ host review
        shell: bash
        run: |
          set -euo pipefail
          python DAW/network/test_verified_event_producer.py
          python DAW/network/test_local_receiver_auth.py
          python DAW/network/test_local_command_bridge.py
          python DAW/network/test_local_receiver_service.py
          python DAW/network/test_local_receiver_session.py
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror DAW/tests/RemoteCrossLanguageHandoffFixture.cpp -o remote-test-bin/handoff-fixture -pthread
          IDW_CPP_REVIEW_FIXTURE=remote-test-bin/handoff-fixture python DAW/network/test_local_ipc_cpp_review.py
          IDW_CPP_REVIEW_FIXTURE=remote-test-bin/handoff-fixture python DAW/network/test_multi_local_ipc_cpp_review.py

      - name: Test mutual TLS client certificate authentication
        shell: bash
        run: python DAW/network/test_mutual_tls.py

      - name: Test mTLS approved client certificate pinning
        shell: bash
        run: python DAW/network/test_tls_client_pin.py

      - name: Test per-command host approval ledger
        shell: bash
        run: python DAW/network/test_host_approval_ledger.py
