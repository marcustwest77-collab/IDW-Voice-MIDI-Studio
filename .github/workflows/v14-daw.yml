name: V14 DAW Foundation Build
on:
  push:
    branches: [v14-daw-foundation]
  pull_request:
    branches: [v14-daw-foundation, 'feature/**', 'fix/**']
  workflow_dispatch:
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure V14 DAW
        run: cmake -S . -B build-v14 -DIDW_BUILD_DAW=ON -DBUILD_TESTING=ON
      - name: Build workstation and test
        run: cmake --build build-v14 --config Release --target IDWDAW IDWDAWSessionTests IDWDAWTimelineTests IDWDAWPersistenceTests IDWDAWBounceTests IDWDAWMidiBenchmark IDWDAWClipEditingTests IDWDAWMultiClipTests IDWDAWClipFadeTests IDWDAWClipTransportTests IDWDAWWaveformTests IDWDAWZoomTests IDWDAWSnapTests IDWDAWClipHistoryTests IDWDAWRecoveryTests IDWDAWRelinkTests IDWDAWRecordingTests IDWDAWRemotePermissionTests IDWDAWRemoteCommandTests IDWDAWRemoteSessionControllerTests IDWDAWRemoteHandshakeTests IDWDAWRemoteWireFrameTests IDWDAWRemoteStreamDecoderTests IDWDAWRemoteReceivePipelineTests IDWDAWRemoteParserTests IDWDAWValidatedReceiverTests IDWDAWHostApprovalTests IDWDAWControllerViewTests IDWDAWRemoteReceiptTests IDWDAWHostReviewPanelCompile --parallel 2
      - name: Test session model
        run: ctest --test-dir build-v14 -C Release -R IDWDAW --output-on-failure
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V14-regression-results-${{ matrix.os }}
          path: build-v14/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
      - name: Package macOS application
        if: matrix.os == 'macos-latest'
        run: tar -czf IDW-DAW-V14-macOS.tar.gz -C build-v14/IDWDAW_artefacts .
      - name: Upload macOS application
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IDW-DAW-V14-macOS
          path: IDW-DAW-V14-macOS.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Report MIDI rendering timings
        run: ctest --test-dir build-v14 -C Release -V -R "^IDWDAWMidiBenchmarkSmoke$"
      - name: Test local AI MCP protocol
        run: python DAW/ai/test_mcp_server.py

      - name: Package Windows private beta
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(Get-ChildItem -Path 'build-v14/IDWDAW_artefacts/Release' -File -Filter '*.exe' |
            Where-Object { $_.Name -eq 'IDW DAW V14 Foundation.exe' })
          if ($apps.Count -ne 1) { throw "Expected exactly one Release DAW executable; found $($apps.Count): $($apps.FullName -join ', ')" }
          New-Item -ItemType Directory -Force -Path beta-windows | Out-Null
          Copy-Item $apps[0].FullName beta-windows/IDW-DAW-V14-Beta.exe
          @'
          IDW Voice MIDI Studio — V14 Windows Testing Beta
          ------------------------------------------------
          1. Extract the ZIP to a folder you own.
          2. Launch IDW-DAW-V14-Beta.exe.
          3. In audio settings, choose an enabled microphone/interface input and output.
          4. Load a WAV beat, arm an empty audio track and record a short vocal.
          5. Stop, listen, save a project, and export a WAV.
          6. Test overdubbing with headphones. Calibration and automatic alignment are experimental.
          Do not use this beta as the only copy of important recordings.
          Windows SmartScreen may warn for unsigned experimental builds.
          '@ | Set-Content -Path beta-windows/README-WINDOWS-BETA.txt
          Get-FileHash beta-windows/IDW-DAW-V14-Beta.exe -Algorithm SHA256 |
            Format-List | Out-File beta-windows/SHA256.txt
      - name: Upload Windows testing beta
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IDW-DAW-V14-Windows-Private-Beta
          path: beta-windows/
          if-no-files-found: error
          retention-days: 14

