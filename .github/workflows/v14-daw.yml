name: IDW Combined Studio Integration Build
on:
  push:
    branches: [feature/all-versions-integration]
  pull_request:
    branches: [release/v14-windows-packaging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure V14 DAW
        run: cmake -S . -B build-v14 -DIDW_BUILD_DAW=ON -DBUILD_TESTING=ON
      - name: Build workstation and test
        run: cmake --build build-v14 --config Release --parallel 2
      - name: Test session model
        run: ctest --test-dir build-v14 -C Release --output-on-failure
      - name: Report MIDI rendering timings
        run: ctest --test-dir build-v14 -C Release -V -R "^IDWDAWMidiBenchmarkSmoke$"
      - name: Test local AI MCP protocol
        run: python DAW/ai/test_mcp_server.py

      - name: Test Windows studio network round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r studio_sessions/requirements.txt
          python studio_sessions/test_windows_network.py build-v14/Release/IDWDAWStudioNetworkTests.exe

      - name: Package Windows private beta
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(Get-ChildItem -Path 'build-v14/IDWDAW_artefacts/Release' -File -Filter '*.exe' |
            Where-Object { $_.Name -eq 'IDW DAW V14 Foundation.exe' })
          if ($apps.Count -ne 1) { throw "Expected exactly one Release DAW executable; found $($apps.Count): $($apps.FullName -join ', ')" }
          New-Item -ItemType Directory -Force -Path beta-windows | Out-Null
          Copy-Item $apps[0].FullName beta-windows/IDW-DAW-V14-Beta.exe
          @'
          IDW Voice MIDI Studio — V14 Windows Testing Beta
          ------------------------------------------------
          1. Extract the ZIP to a folder you own.
          2. Launch IDW-DAW-V14-Beta.exe.
          3. In audio settings, choose an enabled microphone/interface input and output.
          4. Load a WAV beat, arm an empty audio track and record a short vocal.
          5. Stop, listen, save a project, and export a WAV.
          6. Test overdubbing with headphones. Calibration and automatic alignment are experimental.
          Do not use this beta as the only copy of important recordings.
          Windows SmartScreen may warn for unsigned experimental builds.
          '@ | Set-Content -Path beta-windows/README-WINDOWS-BETA.txt
          New-Item -ItemType Directory -Force -Path beta-windows/AI, beta-windows/Documentation, beta-windows/VoiceStudio, beta-windows/VST3 | Out-Null
          Copy-Item 'build-v14/IDWVoiceMIDIStudio_artefacts/Release/Standalone/IDW Voice MIDI Studio.exe' beta-windows/VoiceStudio/
          Copy-Item 'build-v14/IDWVoiceMIDIStudio_artefacts/Release/VST3/IDW Voice MIDI Studio.vst3' beta-windows/VST3/ -Recurse
          Copy-Item docs/COMBINED-BETA.md beta-windows/Documentation/
          Copy-Item docs/UNIFIED-DAW-PROGRESS.md beta-windows/Documentation/
          Copy-Item docs/USER_MANUAL.md beta-windows/Documentation/
          New-Item -ItemType Directory -Force -Path beta-windows/ThirdPartyNotices | Out-Null
          Copy-Item build-v14/_deps/juce-src/LICENSE.md beta-windows/ThirdPartyNotices/JUCE-LICENSE.md
          Copy-Item DAW/ai/idw_mcp_server.py beta-windows/AI/
          Copy-Item docs/V14_WINDOWS_RELEASE.md beta-windows/Documentation/
          Copy-Item DAW/README.md beta-windows/Documentation/DEVELOPMENT-NOTES.md
          $info = (Get-Item beta-windows/IDW-DAW-V14-Beta.exe).VersionInfo
          $version = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          if ($version -ne '14.0.0.0') { throw "Unexpected DAW file version: $version" }
          @{
            source_commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            file_version = $version
            release_channel = 'combined-integration-beta'
            signature_status = (Get-AuthenticodeSignature beta-windows/IDW-DAW-V14-Beta.exe).Status.ToString()
          } | ConvertTo-Json | Set-Content beta-windows/BUILD-INFO.json
          Get-ChildItem beta-windows -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path beta-windows).Path, $_.FullName)
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $relative"
          } | Set-Content SHA256-staging.txt
          Move-Item SHA256-staging.txt beta-windows/SHA256.txt
      - name: Build per-user Windows beta installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 compiler is required on this runner' }
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & $iscc "/DPackageRoot=$((Resolve-Path beta-windows).Path)" "/DOutputDir=$((Resolve-Path installer-output).Path)" installer/windows/IDWDAWV14.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed: $LASTEXITCODE" }
          Get-FileHash installer-output/*.exe -Algorithm SHA256 | Format-List | Out-File installer-output/SHA256.txt
      - name: Upload Windows beta installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IDW-Combined-Studio-Windows-Beta-Installer
          path: installer-output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows testing beta
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IDW-Combined-Studio-Windows-Portable-Beta
          path: beta-windows/
          if-no-files-found: error
          retention-days: 14
