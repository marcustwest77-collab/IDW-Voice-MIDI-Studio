name: V14 DAW Foundation Build
on:
  push:
    branches: [v14-daw-foundation]
  pull_request:
    branches: [v14-daw-foundation, 'feature/**', 'fix/**', 'test/**', 'ci/**']
  workflow_dispatch:
    inputs:
      sccache_debug:
        # Off by default: SCCACHE_LOG also pins sccache out of client-side mode.
        description: "Log sccache per-compile cache decisions"
        type: boolean
        default: false
# Newer pushes supersede older ones: without this, every sync queued another
# two-runner matrix and the backlog starved the head that mattered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A wedged run should fail rather than hold a runner and the queue. Job
    # time excludes queueing, so the macOS capacity delays do not count here.
    # On the current Ninja + sccache leg a cold cache costs a 42m41s build and a
    # ~46m job with 834 misses and no hits (#1031, workflow_dispatch on the
    # branch), while a warm run is about 5m. 100 covers the one cold run that
    # repopulates the cache, with room to spare, and keeps the wedged-job guard
    # realistic. The 65m44s-77m55s figures were the MSBuild leg and no longer
    # describe this job.
    timeout-minutes: 100
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: v1
    steps:
      - uses: actions/checkout@v4
      # MSBuild ran one project per process: 103 `MSBuild version` banners in
      # #1022, one per --target, back to back, so the leg never had two cl.exe
      # in flight. Ninja builds the whole target list as one graph with -j and
      # is also the only generator family where CMake honours
      # CMAKE_<LANG>_COMPILER_LAUNCHER, which is what sccache needs. Multi-Config
      # keeps the Release/ artefact paths the packaging step expects.
      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      # Opt-in only. `sccache --show-stats` aggregates and cannot say which
      # translation unit missed, but setting SCCACHE_LOG also pins sccache out
      # of client-side mode, so it must not be on by default. It has to be set
      # before the action starts the server, and a daemonised server has no
      # stderr, so the per-compile lines only exist via SCCACHE_ERROR_LOG.
      - name: Enable sccache debug logging
        if: matrix.os == 'windows-latest' && github.event.inputs.sccache_debug == 'true'
        shell: bash
        run: |
          echo "SCCACHE_LOG=debug" >> "$GITHUB_ENV"
          echo "SCCACHE_ERROR_LOG=${GITHUB_WORKSPACE}/sccache.log" >> "$GITHUB_ENV"
      # Both legs cache now. Windows needed it because MSBuild ran one project per
      # process; macOS had no compiler cache at all, and it pays the same
      # duplication (820 compiles for 103 targets, 684 of them JUCE module
      # recompiles), which made its ~14m35s build the PR's critical path.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      # sccache's GitHub Actions backend needs these two tokens in the process
      # environment; the runner does not hand them to run steps on its own.
      - name: Export sccache cache tokens
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      # macOS uses the default Makefile generator, which honours
      # CMAKE_<LANG>_COMPILER_LAUNCHER (MSBuild does not), so the same two flags
      # apply here. No other configure option changes.
      - name: Configure V14 DAW
        if: matrix.os != 'windows-latest'
        run: >-
          cmake -S . -B build-v14
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DIDW_BUILD_DAW=ON -DBUILD_TESTING=ON -DIDW_BUILD_VST3_PROBE=ON
      - name: Configure V14 DAW with sccache
        if: matrix.os == 'windows-latest'
        run: >-
          cmake -S . -B build-v14 -G "Ninja Multi-Config"
          -DCMAKE_CONFIGURATION_TYPES=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DIDW_BUILD_DAW=ON -DBUILD_TESTING=ON -DIDW_BUILD_VST3_PROBE=ON
      - name: Build workstation and test
        run: cmake --build build-v14 --config Release --target IDWDAW IDWVst3EffectProbe IDWDAWStereoEffectSlotTests IDWDAWTrackAudioBusTests IDWDAWExperimentalEffectPolicyTests IDWDAWEffectDiagnosticMetricsTests IDWDAWPluginStateDataTests IDWDAWDimensionalControlsTests IDWDAWPianoRollCloseTests IDWDAWPianoRollDragThresholdTests IDWDAWPianoRollSnapTests IDWDAWMidiNoteDeleteTests IDWDAWMidiNoteSelectionTests IDWDAWPianoRollLayoutTests IDWDAWPlaybackLoopTests IDWDAWLivePlaybackLoopTests IDWDAWWavExportReceiptTests IDWDAWClipSplitDialogTests IDWDAWClipPositionDialogTests IDWDAWAudioClipIdentityTests IDWDAWArmedRecordingPreflightTests IDWDAWRecordingPreflightTests IDWDAWAudioDeviceRecallStatusTests IDWDAWAudioDeviceRecallIntegrationTests IDWDAWAudioDevicePreferencesTests IDWDAWMidiLengthTests IDWDAWMidiQuantizeTests IDWDAWMidiTransposeTests IDWDAWMidiTrackVelocityTests IDWDAWMidiTrackRepeatTests IDWDAWMidiNudgeTests IDWDAWMidiDuplicateTests IDWDAWMidiVelocityTests IDWDAWStandardMidiImportTests IDWDAWStandardMidiExportTests IDWDAWMasterMixRecallTests IDWDAWPianoRollNavigationTests IDWDAWMidiEditHistoryTests IDWDAWMidiBounceTests IDWDAWPortableProjectTests IDWDAWProjectIntegerTests IDWDAWSessionSaveTests IDWDAWMultitrackOverdubTests IDWDAWExtendedRecordingTests IDWDAWAudioCallbackIsolationTests IDWDAWAudioBackendTests IDWDAWRecordEditRoundtripTests IDWDAWWindowsCommandReviewOperationTests IDWDAWLocalCommandConsentTests IDWDAWWindowsCommandReviewTests IDWDAWCommandReviewWireTests IDWDAWTLSOfferWireTests IDWDAWBridgeReadyWireTests IDWDAWPrivateReadinessTests IDWDAWLocalOfferConsentTests IDWDAWManagedOfferControllerTests IDWDAWTransportDispatchGuardTests IDWDAWWindowsBridgeSessionTests IDWDAWWindowsBootstrapChannelTests IDWDAWLocalSessionOwnerTests IDWDAWLocalSocketReceiverTests IDWDAWSessionTests IDWDAWTimelineTests IDWDAWPersistenceTests IDWDAWBounceTests IDWDAWExportOutcomeTests IDWDAWExportAlertMessageBoxTests IDWDAWPluginLoadGateTests IDWDAWPluginLoadDeadlineTests IDWDAWExportSessionTests IDWDAWExportSessionStressTests IDWDAWMidiBenchmark IDWDAWClipEditingTests IDWDAWMultiClipTests IDWDAWClipFadeTests IDWDAWClipTransportTests IDWDAWWaveformTests IDWDAWZoomTests IDWDAWSnapTests IDWDAWClipHistoryTests IDWDAWRecoveryTests IDWDAWNewProjectTests IDWDAWProjectDocumentStatusTests IDWDAWProjectSaveDestinationTests IDWDAWTrackRenameTests IDWDAWRecentProjectsTests IDWDAWRelinkTests IDWDAWRecordingTests IDWDAWRemotePermissionTests IDWDAWRemoteCommandTests IDWDAWRemoteSessionControllerTests IDWDAWRemoteHandshakeTests IDWDAWRemoteWireFrameTests IDWDAWRemoteStreamDecoderTests IDWDAWRemoteReceivePipelineTests IDWDAWRemoteParserTests IDWDAWValidatedReceiverTests IDWDAWHostApprovalTests IDWDAWControllerViewTests IDWDAWRemoteReceiptTests IDWDAWHostReviewPanelCompile IDWDAWHostReviewControllerTests IDWDAWSessionReviewCoordinatorTests --parallel 4
      # Both legs cache, so both report. SCCACHE_PATH is exported by the action;
      # fall back to the binary's PATH entry for runners that only install it.
      - name: Report sccache statistics
        if: always()
        shell: bash
        run: '"${SCCACHE_PATH:-sccache}" --show-stats'
      - name: List sccache cache misses
        if: always() && matrix.os == 'windows-latest' && github.event.inputs.sccache_debug == 'true'
        shell: bash
        run: |
          log="${GITHUB_WORKSPACE}/sccache.log"
          if [ ! -f "$log" ]; then
            echo "sccache log missing at $log"
            exit 0
          fi
          echo "log lines: $(wc -l < "$log")"
          echo "hits:   $(grep -ac 'Cache hit in ' "$log" || true)"
          echo "misses: $(grep -ac 'Cache miss in ' "$log" || true)"
          echo
          echo "== cache misses =="
          grep -a 'Cache miss in ' "$log" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' || true
      - name: Upload experimental VST3 probe
        uses: actions/upload-artifact@v4
        with:
          name: IDW-VST3-Effect-Probe-${{ matrix.os }}
          path: |
            build-v14/IDWVst3EffectProbe_artefacts/**/IDWVst3EffectProbe
            build-v14/IDWVst3EffectProbe_artefacts/**/IDWVst3EffectProbe.exe
          if-no-files-found: error
          retention-days: 14
      - name: Test session model
        run: ctest --test-dir build-v14 -C Release -R IDWDAW --output-on-failure
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V14-regression-results-${{ matrix.os }}
          path: build-v14/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
      - name: Package macOS application
        if: matrix.os == 'macos-latest'
        run: tar -czf IDW-DAW-V14-macOS.tar.gz -C build-v14/IDWDAW_artefacts .
      - name: Upload macOS application
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IDW-DAW-V14-macOS
          path: IDW-DAW-V14-macOS.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Report MIDI rendering timings
        run: ctest --test-dir build-v14 -C Release -V -R "^IDWDAWMidiBenchmarkSmoke$"
      - name: Test local AI MCP protocol
        run: python DAW/ai/test_mcp_server.py

      - name: Package Windows private beta
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = @(Get-ChildItem -Path 'build-v14/IDWDAW_artefacts/Release' -File -Filter '*.exe' |
            Where-Object { $_.Name -eq 'IDW DAW V14 Foundation.exe' })
          if ($apps.Count -ne 1) { throw "Expected exactly one Release DAW executable; found $($apps.Count): $($apps.FullName -join ', ')" }
          New-Item -ItemType Directory -Force -Path beta-windows | Out-Null
          Copy-Item $apps[0].FullName beta-windows/IDW-DAW-V14-Beta.exe
          @'
          IDW Voice MIDI Studio — V14 Windows Testing Beta
          ------------------------------------------------
          1. Extract the ZIP to a folder you own.
          2. Launch IDW-DAW-V14-Beta.exe.
          3. In audio settings, choose an enabled microphone/interface input and output.
          4. Load a WAV beat, arm an empty audio track and record a short vocal.
          5. Stop, listen, save a project, and export a WAV.
          6. Test overdubbing with headphones. Calibration and automatic alignment are experimental.
          Do not use this beta as the only copy of important recordings.
          Windows SmartScreen may warn for unsigned experimental builds.
          '@ | Set-Content -Path beta-windows/README-WINDOWS-BETA.txt
          Get-FileHash beta-windows/IDW-DAW-V14-Beta.exe -Algorithm SHA256 |
            Format-List | Out-File beta-windows/SHA256.txt
      - name: Upload Windows testing beta
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: IDW-DAW-V14-Windows-Private-Beta
          path: beta-windows/
          if-no-files-found: error
          retention-days: 14

  # ThreadSanitizer on the export-session stress test: the race check for the
  # single-owner atomics. Linux only, no JUCE build, so it stays a few minutes.
  sanitizer:
    name: sanitizer (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: thread
            option: IDW_SANITIZE_THREAD
          - name: address-undefined
            option: IDW_SANITIZE_ADDRESS
    steps:
      - uses: actions/checkout@v4
      # Standalone project: no JUCE, so configure cannot need freetype or X11.
      - name: Configure with ${{ matrix.name }}
        run: cmake -S DAW/tests/export_session_stress -B build-sanitizer -D${{ matrix.option }}=ON
      - name: Build the session stress test
        run: cmake --build build-sanitizer
      - name: Run under ${{ matrix.name }}
        run: ctest --test-dir build-sanitizer --output-on-failure
